
##############################################
# Settings for mult example
##############################################

# Source files
rtl_path: "odatix_userconfig/architectures/RISCV_SuperScalar/RISCV_superscalar.vhd"
top_level_file: "RISCV_superscalar.vhd"
top_level_module: "mult"

# Signals
clock_signal: "clock"
reset_signal: "reset"

# Delimiters for parameter files
use_parameters: Yes
start_delimiter: "mult #("
stop_delimiter: ")("

# Default frequencies (in MHz)
fmax_synthesis:
  lower_bound: 50
  upper_bound: 1500
custom_freq_synthesis:
  list: [50, 100, 150, 200, 250]
analysis:
  list: [10]

# Optional target-specific frequencies (in MHz)
xc7s25-csga225-1:
  fmax_synthesis:
    lower_bound: 100
    upper_bound: 600
  custom_freq_synthesis:
    list: [50, 100]
xc7a100t-csg324-1:
  fmax_synthesis:
    lower_bound: 100
    upper_bound: 600
  custom_freq_synthesis:
    list: [50, 100]
  analysis:
    list: [50]
xc7k70t-fbg676-2:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 1500
  custom_freq_synthesis:
    list: [50, 100]
  analysis:
    list: [50]
XFAB180CMOS:
  fmax_synthesis:
    lower_bound: 150
    upper_bound: 1400
  custom_freq_synthesis:
    list: [50, 100]
  analysis:
    list: [50]
AMS350CMOS:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 400
  custom_freq_synthesis:
    list: [50, 100]
  analysis:
    list: [50]
